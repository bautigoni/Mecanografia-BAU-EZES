name: Deploy to VPS

# Corre los mismos pasos manuales de DEPLOY.md §7 por SSH, contra el VPS del
# proyecto en 168.75.68.75 (ruta /opt/apps/typely). Caddy NO se recarga acá:
# el contenedor del frontend sirve solo en loopback, así que alcanza con
# recrear el compose; un `caddy validate && caddy reload` a mano solo importa
# cuando cambia el Caddyfile.
#
# Dispara con cada push a `production`, que es la rama desplegada. `dev` NO
# despliega: ahí se trabaja, y se mergea a `production` recién cuando los
# cambios andan y están listos para salir.
#
# `workflow_dispatch` queda para poder desplegar a mano desde la pestaña
# Actions sin tener que empujar un commit.

on:
  push:
    branches: [production]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd /opt/apps/typely
            echo "── git pull ──"
            git pull
            echo "── docker compose up -d --build ──"
            docker compose up -d --build
            echo "── smoke test ──"
            sleep 4
            curl -fsSI http://127.0.0.1:3005 >/dev/null && echo "frontend OK" || (echo "frontend FAILED"; exit 1)
            curl -fsSI http://127.0.0.1:3007/health >/dev/null && echo "api OK" || (echo "api FAILED"; exit 1)
            echo "── done ──"
